<!DOCTYPE html>
<html lang="zh-CN" class="t-g1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="单词卡">
<title>单词卡</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="stylesheet" href="dist/app.css">
<style>
  /* meta theme-color 没法写变量，只能写死；其余一律走 tokens 变量 */
  html,body{margin:0;height:100%;background:var(--canvas)}
  #app{height:100vh;height:100dvh;overflow:hidden}
</style>
</head>
<body>
<div id="app"></div>
<script src="dist/app.js"></script>
<script>
  /* Service Worker 只在 http(s) 下能用：双击 file:// 打开时直接跳过，不报错。
     装了 SW 之后，断网刷新仍然能背（sw.js 里预缓存了 index/app.js/app.css）。 */
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function (e) {
        if (window.console) console.warn("[wc7] Service Worker 注册失败：", e && e.message);
      });
    });
  }
</script>
</body>
</html>
